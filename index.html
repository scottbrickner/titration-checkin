<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titration Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: cardinal sidebar (session steps) + one working column; below 900px the sidebar becomes a top bar. Single light look on purpose: it is used at the bedside on an iPad. */
:root{
  --cardinal:#990000; --gold:#FFCC00; --green:#2E7D32;
  --ink:#111111; --muted:#6B6B6B; --line:#CCCCCC; --paper:#FFFFFF; --wash:#F6F4F2;
  --font:"Calibri","Carlito","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.4 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{background:var(--cardinal);color:#fff;padding:30px 0 24px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.side .name{font-weight:700;font-size:22px;padding:0 24px}
.side .ver{font-size:13px;opacity:.78;padding:0 24px 18px}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 20px 0 24px;border-left:5px solid transparent;font-size:16px;color:rgba(255,255,255,.6)}
.steps li.sub{padding-left:48px;font-size:15px}
.steps li.done{color:#fff}
.steps li.cur{color:#fff;font-weight:700;border-left-color:var(--gold)}
.steps li.link{cursor:pointer}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.55);flex:none}
.done .dot{background:var(--gold);border-color:var(--gold)}
.cur .dot{border-color:var(--gold)}
.side .foot{margin-top:auto;padding:0 24px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.side .foot button{background:none;border:0;color:#fff;text-decoration:underline;padding:6px 0;text-align:left;cursor:pointer;min-height:44px}

.top{display:none}
main{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:40px 40px 28px;gap:16px;min-width:0}
.wrap{width:100%;max-width:880px;display:flex;flex-direction:column;gap:16px;flex:1}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:21px;margin:8px 0 0}
.lead{color:var(--muted);margin:0;max-width:65ch}
.hint{color:var(--muted);font-size:16px;margin:0}

.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);padding:16px 18px;cursor:pointer;min-height:76px}
.tile[aria-checked="true"]{border-left-color:var(--cardinal)}
.tile .t{font-weight:700;font-size:19px}
.tile .s{color:var(--muted);font-size:15px}
.tile .txt{flex:1;min-width:0}
.box{width:26px;height:26px;border:1.5px solid var(--muted);flex:none;display:inline-flex;align-items:center;justify-content:center;background:#fff}
[aria-checked="true"] > .box,[aria-checked="true"] .box{background:var(--green);border-color:var(--green)}
[aria-checked="true"] .box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.list{display:flex;flex-direction:column;gap:12px}
.check{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;padding:8px 0;cursor:pointer;min-height:48px;font-size:18px}

.tabs{display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 0;font-size:16px;color:var(--muted);cursor:pointer;min-height:44px;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--cardinal)}
.card{border:1px solid var(--line);border-left:4px solid var(--green);padding:16px 20px}
.card .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card p{margin:8px 0 0;font-size:18px;line-height:1.4}

.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:p}
.points li{counter-increment:p;display:flex;gap:12px;font-size:19px;padding-left:14px;border-left:4px solid transparent}
.points li::before{content:counter(p) ".";font-weight:700;color:var(--cardinal)}
.points li.hi{border-left-color:var(--gold)}
.callout{border-left:4px solid var(--gold);padding-left:18px;font-size:21px;line-height:1.45;margin:0;max-width:65ch}
.ask{font-weight:700;font-size:20px}
.cite{font-size:13px;color:var(--muted);margin-top:auto}

.case{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
.rail{display:flex;flex-direction:column;gap:16px}
.panel{border:1px solid var(--line);border-top:3px solid var(--cardinal);padding:16px 18px}
.panel .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.order{font-size:16px;margin:8px 0 0}
.status{color:var(--cardinal);font-size:14px;min-height:20px;margin-top:6px}
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:10px}
.vitals .k{font-size:14px;color:var(--muted)}
.vitals .v{font-weight:700;font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);margin-top:6px}
.bar.ok{background:var(--green)}
.q{display:flex;flex-direction:column;gap:10px}
.scenario{font-size:19px;margin:0}
.prompt{font-weight:700;font-size:22px;margin:0 0 4px}
.opt{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);padding:13px 18px;font-size:18px;cursor:pointer;min-height:56px}
.opt.ok{border-left-color:var(--green)}
.opt:disabled{cursor:default;color:inherit}
.fb{font-size:17px;padding:2px 0 2px 12px;margin:-2px 0 2px}
.fb.no{border-left:3px solid var(--cardinal)}
.fb.yes{color:var(--green)}

.summary{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px 16px;margin:0}
.summary dt{color:var(--muted);font-size:15px;padding-top:2px}
.summary dd{margin:0;font-size:18px}
.record{border:1px solid var(--line);border-left:4px solid var(--cardinal);padding:14px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.record .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.record code{font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--wash);padding:10px 12px;width:100%;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.card.primary{border-left-color:var(--gold)}
.card ul{margin:8px 0 4px;padding-left:22px}
.card li{font-size:18px;line-height:1.4;margin:4px 0}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .t{font-weight:700;font-size:19px;margin-top:2px}
.badge{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:3px 8px}
.date{display:flex;flex-direction:column;gap:6px;max-width:320px}
.date label{font-weight:700;font-size:18px}
.date input{font:inherit;font-size:18px;min-height:52px;padding:8px 12px;border:1px solid var(--muted);background:#fff;color:var(--ink)}
.note{border-left:4px solid var(--gold);padding-left:16px;margin:0;max-width:70ch}
.start{display:flex;flex-direction:column;gap:10px;max-width:65ch}
.start ol{margin:0;padding-left:22px}
.start li{margin:4px 0}

.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;padding-top:12px;margin-top:auto}
.btn{min-height:56px;min-width:140px;padding:0 24px;font-weight:700;font-size:18px;border:0;background:var(--cardinal);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--line);min-width:120px}
.btn:disabled{background:var(--line);cursor:default}
.toast{color:var(--green);font-size:15px}

@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cardinal);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:2;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .top b{font-size:17px}
  .top span{font-size:14px;opacity:.9;text-align:right}
  main{padding:24px 16px 20px;min-height:auto}
  .case{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr;gap:2px}
  .summary dd{margin-bottom:10px}
}
@media (prefers-reduced-motion:no-preference){.opt,.tile,.btn{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Session steps"></nav>
  <div>
    <div class="top" id="top"></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

  done:{status:"Emergent titration — block started 10:02",next:"In progress",clock:"10:05",map:"58",rate:"10 mcg/min",last:"10:03"}},

function sidebar(){

    const link=st==="done"&&back.includes(s[0]);
    h+=`<li class="${st}${s[2]?" sub":""}${link?" link":""}" ${link?`data-go="${s[0]}" role="button" tabindex="0"`:""} ${st==="cur"?'aria-current="step"':""}><span class="dot"></span>${esc(s[1])}</li>`;});
  h+=`</ol><div class="foot">${S.scr!=="home"?'<button data-act="exit">Start over</button>':""}</div>`;
  document.getElementById("side").innerHTML=h;
  const cur=steps().find(s=>s[0]===S.scr);
  document.getElementById("top").innerHTML=`<b>Titration Check-In</b><span>${cur?esc(cur[1].replace(/^\d\s+/,"")):"Debrief guide"}</span>`;
}

const actions=(...b)=>`<div class="actions">${b.join("")}</div>`;
const btn=(label,act,o={})=>`<button class="btn${o.out?" out":""}" data-act="${act}"${o.dis?" disabled":""}>${esc(label)}</button>`;
const chk=(on,label,act,i)=>`<button class="check" role="checkbox" aria-checked="${on?"true":"false"}" data-act="${act}" data-i="${i}"><span class="box"></span><span>${esc(label)}</span></button>`;

const V={
 home(){return `<div class="eyebrow">Targeted re-education debrief</div><h1>Titration Check-In</h1>
  <p class="lead">For a titration policy fallout found on audit. You and the RN work through four short parts together on this screen, about 10 to 15 minutes. Every check-in covers all three titration practice points, whatever the finding, plus a propofol point and a propofol case when propofol was involved. Nothing typed here is saved; you record completion in the completion record app at the end.</p>
  <div class="start"><h2>Before you start</h2><ol>
   <li>Have the RN pull up the order involved in the finding.</li>
   <li>Have the incident date from the audit tool, and know which finding prompted the check-in.</li>
   <li>Have the Debrief Completion Record tab ready to log the check-in when you finish.</li></ol>
  <p class="note">No patient information goes on this page or in the completion record. The case patient is fictional.</p></div>
  ${actions(CONFIG.formUrl?`<a class="btn out" href="${esc(teamsApp(CONFIG.formUrl))}">Open check-in log</a>`:"",btn("Start debrief","start"))}`;},
 p1(){return `<div class="eyebrow">Part 1 of 4 · Review the error</div><h1>What did the audit find?</h1>
  <div class="date"><label for="incdate">Incident date</label><input type="date" id="incdate" value="${esc(S.date)}" max="${todayISO()}" required>
   <span class="hint">The date the audit found the RN out of compliance, from the audit tool.</span></div>
  <h2>Infusions involved</h2>
  <div class="list" role="radiogroup" aria-label="Infusions involved">
   <button class="tile" role="radio" aria-checked="${S.inf==="titr"}" data-act="inf" data-c="titr"><span class="txt"><span class="t">Vasoactive or other titratable infusions</span><br><span class="s">Reviews the three titration practice points and the titration case</span></span><span class="box"></span></button>
   <button class="tile" role="radio" aria-checked="${S.inf==="prop"}" data-act="inf" data-c="prop"><span class="txt"><span class="t">Propofol, with or without other titratable infusions</span><br><span class="s">Reviews the three titration points plus the propofol point, and adds a propofol case</span></span><span class="box"></span></button>
  </div>
  <h2>Primary concern <span class="hint" style="font-weight:400">(optional)</span></h2>
  <p class="hint">Every point shown is reviewed with every RN. Mark the finding or findings that prompted this check-in to highlight them.</p>
  <div class="list">${pts().map(f=>`<button class="tile" role="checkbox" aria-checked="${S.sel.has(f.c)}" data-act="find" data-c="${f.c}"><span class="txt"><span class="t">${esc(f.t)}</span><br><span class="s">${esc(f.s)}</span></span><span class="box"></span></button>`).join("")}</div>
  <p class="hint">Ask the RN to read the order back, then describe what was happening at the time.</p>
  ${actions(btn("Next","toPrac",{dis:!p1OK()}))}`;},
 prac(){return `<div class="eyebrow">Part 1 of 4 · Review the error</div><h1>Correct practice: all ${nWord(pts().length)} points</h1>
  <p class="hint">Review every element with the RN. Tap the check when the RN states that point's correct practice in their own words.</p>
  ${pts().map((f,i)=>{const pri=S.sel.has(f.c);return `<div class="card${pri?" primary":""}"><div class="head"><div><div class="lbl">Point ${i+1} of ${pts().length}</div><div class="t">${esc(f.name)}</div></div>${pri?'<span class="badge">Primary concern</span>':""}</div>
   <ul>${f.el.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>${chk(S.v[i],"RN states the correct practice for this point in their own words.","verb",i)}</div>`;}).join("")}
  ${actions(btn("Back","toP1",{out:1}),btn("Next","toP2",{dis:S.v.slice(0,pts().length).some(x=>!x)}))}`;},
 p2(){return `<div class="eyebrow">Part 2 of 4 · Policy points</div><h1>${S.prop?"Six":"Five"} policy points</h1>
  <p class="hint"><b>Reference:</b> CP 4-156, Administration and Titration of Intravenous Medications${S.prop?"; CP 4-113, Controlled Substances; CP 3-162, Awakening and Breathing Trials":""}. Numbers in parentheses are CP 4-156 items.</p>
  <ol class="points">${ptsList().map(p=>`<li class="${p[1]&&[...S.sel].some(c=>p[1].includes(c))?"hi":""}"><span>${esc(p[0])}</span></li>`).join("")}</ol>
  ${S.sel.size?'<p class="hint">Gold marks the points tied to the primary concern.</p>':'<p class="hint">Every point shown applies to this check-in.</p>'}
  ${actions(btn("Back","toPrac",{out:1}),btn("Next","toP3"))}`;},
 p3(){return `<div class="eyebrow">Part 3 of 4 · Why it matters</div><h1>Why one minute matters</h1>
  <p class="callout">Small deviations that cause no harm tend to become the normal way of working. Workarounds become so routine they are no longer seen as risks. Every titration either reinforces the order or wears it down.</p>
  <p class="ask">Ask: Where have you seen a small shortcut like this become normal?</p>
  <p class="cite">Trepanier, S. (2026). Overcoming the normalization of deviance in clinical practice. <i>The Journal of Continuing Education in Nursing, 57</i>(4), 150–151. https://doi.org/10.3928/00220124-20260304-02</p>
  ${actions(btn("Back","toP2",{out:1}),btn("Continue to case","toCase"))}`;},
 case(){const C=CASES[S.ck],q=C.Q[S.q],m=S.m,last=S.q>=C.Q.length-1;
  const opts=q.o.map((o,i)=>{const ok=S.lock&&o[1];return `<button class="opt${ok?" ok":""}" data-act="opt" data-i="${i}"${S.lock?" disabled":""}>${esc(o[0])}</button>${S.tap===i?`<div class="fb ${o[1]?"yes":"no"}" role="status">${esc(o[2])}</div>`:""}`;}).join("");
  const nextLbl=!last?"Next question":(S.ck==="v"&&S.prop?"Propofol case":"Teach-back");
  return `<div class="eyebrow">Part 4 of 4 · ${C.title} · Question ${S.q+1} of ${C.Q.length}</div>
  <div class="case"><div class="rail">
   <div class="panel"><div class="lbl">Active order</div><p class="order">${C.order}</p><p class="hint" style="font-size:14px;margin-top:8px">${esc(C.note)}</p></div>
   <div class="panel"><div class="lbl">Patient monitor</div><div class="status">${esc(m.status)}</div>
    <div class="vitals">${C.f.map(x=>`<div><div class="k">${x[0]}</div><div class="v"${x[1]==="setup"?' style="font-size:16px;white-space:normal"':""}>${esc(m[x[1]])}</div></div>`).join("")}</div>
    <div class="k" style="margin-top:18px;font-size:14px;color:var(--muted)">Next titration allowed</div><div class="bar${m.ok?" ok":""}"></div></div>
  </div><div class="q"><p class="scenario">${esc(q.sc)}</p><p class="prompt">${esc(q.q)}</p>${opts}</div></div>
  ${actions(btn(nextLbl,"nextQ",{dis:!S.lock}))}`;},
 pcase(){return V.case();},
 teach(){return `<div class="eyebrow">Part 4 of 4 · Teach-back</div><h1>Teach-back</h1><p class="hint">Tap each item as the RN states it.</p>
  <div>${tbList().map((t,i)=>chk(S.t[i],t,"tb",i)).join("")}</div>
  ${actions(btn("Restart case","restartCase",{out:1}),btn("Finish","toSum",{dis:S.t.slice(0,tbList().length).some(x=>!x)}))}`;},
 sum(){const n=firstTry();const np=firstTry(S.resP);const detailP=S.resP.map(r=>`Q${r.q} ${r.correctFirst?"first try":r.att+" attempts"}`).join(" · ");const detail=S.resV.map(r=>`Q${r.q} ${r.correctFirst?"first try":r.att+" attempts"}`).join(" · ");
  const url=formLink();
  return `<div class="eyebrow">Record completion</div><h1>Debrief complete</h1>
  <p class="lead">Copy the debrief record, open the Debrief Completion Record, pick the RN, paste the record and save. The RN's manager is emailed automatically.</p>
  <div class="record"><div class="lbl">Debrief record</div><code id="rec">${esc(recordText())}</code>
   <button class="btn" data-act="copy">${S.copied?"Copied":"Copy debrief record"}</button></div>
  <dl class="summary">
   <dt>Incident date</dt><dd>${esc(fmtDate(S.date))}</dd>
   <dt>Infusions</dt><dd>${S.prop?"Propofol and other titratable infusions":"Vasoactive or other titratable infusions"}</dd>
   <dt>Points reviewed</dt><dd>All ${nWord(pts().length)}: ${pts().map(f=>esc(f.name)).join("; ")}</dd>
   <dt>Primary concern</dt><dd>${S.sel.size?sorted().map(f=>esc(f.t)).join("<br>"):"None marked"}</dd>
   <dt>Correct practice stated</dt><dd>${pts().length} of ${pts().length} points</dd>
   <dt>Case</dt><dd>${n} of 4 correct on the first try<br><span class="hint">${esc(detail)}</span></dd>
   ${S.prop?`<dt>Propofol case</dt><dd>${np} of ${PQ.length} correct on the first try<br><span class="hint">${esc(detailP)}</span></dd>`:""}
   <dt>Teach-back</dt><dd>${tbList().length} of ${tbList().length} items stated</dd>
   <dt>Next step</dt><dd>The RN's manager receives an email that the check-in is complete and follows up with the RN.</dd>
  </dl>
  ${actions(btn("Start a new debrief","exit",{out:1}),url?`<a class="btn" href="${esc(teamsApp(url))}">Open completion record</a>`:`<span class="hint">Completion record link not set yet (CONFIG.formUrl).</span>`)}
  ${url?`<p class="hint" style="margin-top:8px">Using Teams in a browser? <a href="${esc(url)}" target="_blank" rel="noopener">Open it in a browser tab instead</a>.</p>`:""}`;}
};

/* Teams deep links: msteams:/l/... hands the link to the Teams app so it switches tabs in place,
   instead of the https link opening a browser window and the "open in app" jump page. */
function teamsApp(u){
  return u.replace(/^https:\/\/teams\.(cloud\.microsoft|microsoft\.com)\/l\//,"msteams:/l/");
}

function formLink(){
  if(!CONFIG.formUrl)return "";
  const p=CONFIG.prefill,vals={findingA:S.sel.has("A")?"Yes":"No",findingB:S.sel.has("B")?"Yes":"No",findingC:S.sel.has("C")?"Yes":"No",verbalization:"Yes",caseScore:String(firstTry()),teachBack:"Yes"};
  const parts=Object.keys(vals).filter(k=>p[k]).map(k=>"r"+encodeURIComponent(p[k])+"="+encodeURIComponent(vals[k]));
  if(!parts.length)return CONFIG.formUrl;
  return CONFIG.formUrl+(CONFIG.formUrl.includes("?")?"&":"?")+parts.join("&");
}
/* One-line debrief record, pasted into Debrief record in the completion app (which splits it on save).
   Fixed order, " | " between fields, Key=Value inside each, no names or patient data.
   Keep the order stable: reports split on it. Bump TCI-V1 when the content changes (e.g. TCI-V2 for phase 2). */
function recordText(){
  const d=S.finished||new Date(),p=n=>String(n).padStart(2,"0");
  const stamp=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  const tries=[1,2,3,4].map(n=>{const r=S.resV.find(x=>x.q===n);return "Q"+n+"Tries="+(r?r.att:"")});
  const ptries=S.prop?["PropCaseFirstTry="+firstTry(S.resP)+"/"+PQ.length,"PropTries="+[1,2,3,4].map(n=>{const r=S.resP.find(x=>x.q===n);return r?r.att:""}).join(",")]:[];
  return ["TCI-V1.2","IncidentDate="+S.date,"Topics="+(S.prop?"Titratable; Propofol":"Titratable"),"Findings="+(S.sel.size?sorted().map(f=>f.tab).join("; "):"None marked"),"Verbal="+pts().length+"/"+pts().length,"CaseFirstTry="+firstTry()+"/4",...tries,...ptries,"TeachBack="+tbList().length+"/"+tbList().length,"Finished="+stamp].join(" | ");
}

function render(){
  if(["prac","p2","p3","case","pcase","teach","sum"].includes(S.scr)&&!p1OK())S.scr="p1";
  if(S.scr==="pcase"&&!S.prop)S.scr="teach";
  sidebar();
  document.getElementById("main").innerHTML=`<div class="wrap">${V[S.scr]()}</div>`;
  document.title=S.scr==="home"?"Titration Check-In":"Titration Check-In · "+(steps().find(s=>s[0]===S.scr)||["","Debrief"])[1].replace(/^\d\s+/,"");
}

function startCase(k="v"){S.ck=k;S.q=0;S.m={...CASES[k].M0};S.res=[];S.tap=null;S.att=0;S.first=null;S.lock=false;}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return;}
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  const a=el.dataset.act,i=+el.dataset.i;
  switch(a){
    case "start":fresh();go("p1");break;
    case "exit":fresh();go("home");break;
    case "find":{const c=el.dataset.c;S.sel.has(c)?S.sel.delete(c):S.sel.add(c);render();break;}
    case "toP1":go("p1");break;
    case "toPrac":if(p1OK())go("prac");break;
    case "tab":S.tab=el.dataset.c;render();break;
    case "verb":S.v[i]=S.v[i]?0:1;render();break;
    case "inf":S.inf=el.dataset.c;S.prop=S.inf==="prop";if(!S.prop){S.sel.delete("D");S.v[3]=0;S.t[5]=0;}render();break;
    case "toP2":go("p2");break;
    case "toP3":go("p3");break;
    case "toCase":startCase("v");S.resV=[];S.resP=[];go("case");break;
    case "opt":{if(S.lock)break;const QQ=CASES[S.ck].Q,o=QQ[S.q].o[i];S.att++;if(S.first==null)S.first=!!o[1];S.tap=i;if(o[1]){S.lock=true;Object.assign(S.m,QQ[S.q].done);}render();break;}
    case "nextQ":{const QQ=CASES[S.ck].Q;S.res.push({q:S.q+1,correctFirst:S.first,att:S.att});
      if(S.q<QQ.length-1){S.q++;S.tap=null;S.att=0;S.first=null;S.lock=false;if(QQ[S.q].enter)S.m={...QQ[S.q].enter};go(S.ck==="p"?"pcase":"case");}
      else if(S.ck==="v"){S.resV=S.res;if(S.prop){startCase("p");go("pcase");}else go("teach");}
      else{S.resP=S.res;go("teach");}break;}
    case "restartCase":startCase("v");S.resV=[];S.resP=[];S.t=[0,0,0,0,0,0];go("case");break;
    case "tb":S.t[i]=S.t[i]?0:1;render();break;
    case "toSum":S.copied=false;S.finished=new Date();go("sum");break;
    case "copy":{const t=recordText();const ok=()=>{S.copied=true;render();};
      try{navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok));}catch(_){fallbackCopy(t,ok);}break;}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="incdate"){S.date=e.target.value;const b=document.querySelector('[data-act="toPrac"]');if(b)b.disabled=!p1OK();}});
document.addEventListener("input",e=>{if(e.target.id==="incdate"){S.date=e.target.value;const b=document.querySelector('[data-act="toPrac"]');if(b)b.disabled=!p1OK();}});
document.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest("[data-go]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();go(g.dataset.go);}});
function fallbackCopy(t,ok){const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(_){}ta.remove();}

render();
</script>
</body>
